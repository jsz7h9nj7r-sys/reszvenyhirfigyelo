<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Részvény Hírfigyelő</title><style>body{font-family:-apple-system,BlinkMacSystemFont,Arial;background:#111;color:#fff;margin:0}header{padding:22px 18px;background:#1b1b1b}h1{margin:0 0 5px}.sub,.muted{color:#aaa}.card{background:#1d1d1d;border-radius:14px;padding:15px;margin:12px 0}.ticker{font-size:20px;font-weight:700}.news{margin-top:12px;padding-top:12px;border-top:1px solid #333}a{color:#6eb5ff;text-decoration:none}button{background:#2d7ff9;color:white;border:0;border-radius:10px;padding:10px 14px;font-size:15px}</style></head><body><header><h1>📈 Részvény Hírfigyelő</h1><div class="sub">Magyar részvényfigyelő • AMD • Nvidia • AI</div></header><main style="padding:16px;max-width:800px;margin:auto"><button onclick="loadNews()">🔄 Frissítés</button><div id="app"></div></main><script>
const stocks=[["AMD","Advanced Micro Devices"],["NVDA","Nvidia"],["AVGO","Broadcom"],["MRVL","Marvell Technology"],["ALAB","Astera Labs"],["MU","Micron Technology"],["ARM","Arm Holdings"],["TSM","TSMC"],["CRDO","Credo Technology"]];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function loadNews(){const app=document.getElementById("app");app.innerHTML=stocks.map(([t,n])=>`<div class="card"><div class="ticker">${t} — ${n}</div><div class="muted">Hírek betöltése…</div></div>`).join("");for(const [t,n] of stocks){try{const r=await fetch("https://api.gdeltproject.org/api/v2/doc/doc?query="+encodeURIComponent(n+" stock")+"&mode=artlist&maxrecords=5&format=json&sort=datedesc");const d=await r.json();const c=[...app.children].find(x=>x.querySelector(".ticker")?.textContent.startsWith(t+" "));if(c)c.innerHTML=`<div class="ticker">${t} — ${n}</div>`+(d.articles||[]).slice(0,5).map(a=>`<div class="news"><a target="_blank" href="${a.url}">${esc(a.title||"Hír")}</a><div class="muted">${esc(a.domain||"")}</div></div>`).join("")||"<div class='muted'>Nincs friss találat.</div>"}catch(e){}}}loadNews();
</script></body></html>
